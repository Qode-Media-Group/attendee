# Production stack for one x86 server, using an external Postgres and Redis and an nginx in front.
# Clone the repo to /opt/attendee and run docker compose from there. Every setting comes from
# .env, see .env.prod.example.

x-attendee-service: &attendee-service
  build: ./
  image: ${BOT_CONTAINER_IMAGE:?}
  volumes:
    - .:/attendee
  networks:
    - attendee_network
  env_file:
    - .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:?}
      max-file: ${LOG_MAX_FILE:?}

services:
  attendee-worker:
    <<: *attendee-service
    command: "celery -A attendee worker -c ${WORKER_CONCURRENCY:?} -l ${CELERY_LOG_LEVEL:?}"

  # Starts each bot in its own container (attendee-bot-<id>), which is removed when the bot
  # ends, so a crashed or stuck bot can't leave Chrome running. Bot containers copy this
  # service's environment and use host networking, so DATABASE_URL and REDIS_URL must be
  # reachable from the host.
  attendee-bot-launcher:
    <<: *attendee-service
    volumes:
      - .:/attendee
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as "app"; the Docker socket is only open to the host's docker group
    group_add:
      - "${DOCKER_GID:?}"
    command: "celery -A attendee worker -Q bot_launcher_vm -c ${BOT_LAUNCHER_CONCURRENCY:?} -l ${CELERY_LOG_LEVEL:?}"
    entrypoint: []

  # Ends bots that stopped sending heartbeats or never launched, and removes their containers
  attendee-bot-cleanup:
    <<: *attendee-service
    volumes:
      - .:/attendee
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?}"
    command: sh -c "while true; do python manage.py clean_up_bots_with_heartbeat_timeout_or_that_never_launched; sleep ${BOT_CLEANUP_INTERVAL_SECONDS:?}; done"
    entrypoint: []

  attendee-scheduler:
    <<: *attendee-service
    command: "python manage.py run_scheduler"
    entrypoint: []

  attendee-app:
    <<: *attendee-service
    # Only reachable through nginx on this server
    ports:
      - "127.0.0.1:${APP_PORT:?}:8000"
    command: "gunicorn attendee.wsgi --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:?}"
    entrypoint: []

  attendee-webpage-streamer:
    <<: *attendee-service
    ports:
      - "127.0.0.1:${WEBPAGE_STREAMER_PORT:?}:8000"
    command: "python bots/webpage_streamer/run_webpage_streamer.py"
    security_opt:
      - seccomp=./bots/web_bot_adapter/chrome_seccomp.json
    profiles:
      - webpage-streamer

networks:
  attendee_network:
    driver: bridge
